[project]
name = "dip-super-resolution"
version = "0.1.0"
description = "Notebook-friendly Deep Image Prior experiments for single-image super-resolution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pillow>=9.5",
    "scikit-image>=0.21",
    "torch>=2.1",
    "torchvision>=0.16",
    "wandb>=0.16",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6.25", "jupyterlab>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dip_sr"]
